# Server Configuration
server:
  host: "0.0.0.0"
  port: 9999
  max_clients: 5
  buffer_size: 65536

# ORB-SLAM3 Configuration
orb_slam3:
  enabled: true
  vocabulary_path: "/path/to/ORB-SLAM3/Vocabulary/ORBvoc.txt"
  config_path: "orb_slam3_wrapper/config/orb_slam3_config.yaml"
  mode: "VI_MONO"  # VI_MONO, VI_STEREO, MONO, STEREO, RGBD

# Camera Configuration
camera:
  width: 640
  height: 480
  fps: 30
  fx: 458.654
  fy: 457.296
  cx: 367.215
  cy: 248.375
  k1: -0.28340811
  k2: 0.07395907
  p1: 0.00019359
  p2: 1.76187114e-05

# IMU Configuration
imu:
  sample_rate_hz: 100
  accel_noise_density: 0.0028  # m/s^2/sqrt(Hz)
  gyro_noise_density: 0.00016  # rad/s/sqrt(Hz)

# Visualization
visualization:
  enabled: true
  ros_master_uri: "http://localhost:11311"
  map_frame: "world"
  camera_frame: "camera"

# Data Storage
storage:
  enabled: true
  database_path: "./data/localization.db"
  save_images: false
  save_imu: true

# Logging
logging:
  level: "INFO"
  file: "./logs/server.log"
